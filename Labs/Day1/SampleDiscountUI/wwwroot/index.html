<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Store — Discount Calculator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 4rem auto; padding: 0 1.25rem; color: #182230; }
    main { border: 1px solid #d8dee8; border-radius: 12px; padding: 2rem; }
    label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
    input, button { font: inherit; padding: .7rem .85rem; }
    input { width: min(100%, 20rem); box-sizing: border-box; }
    button { margin-top: 1rem; cursor: pointer; }
    #result { margin-top: 1.25rem; padding: .8rem; border-radius: 8px; background: #f1f5f9; }
    #result:empty { display: none; }
    #result.error { color: #9b1c1c; background: #fff1f1; }
  </style>
</head>
<body>
  <main>
    <h1>Training Store</h1>
    <p>Calculate the 10% training discount for an order.</p>
    <form id="discount-form">
      <label for="order-amount">Order amount</label>
      <input id="order-amount" name="orderAmount" type="number" min="0" step="0.01" value="200.00" required>
      <button type="submit">Calculate</button>
    </form>
    <div id="result" role="status" aria-live="polite"></div>
  </main>
  <script>
    const form = document.querySelector('#discount-form');
    const amountInput = document.querySelector('#order-amount');
    const result = document.querySelector('#result');

    amountInput.addEventListener('invalid', () => {
      result.classList.add('error');
      result.textContent = amountInput.validity.rangeUnderflow
        ? 'Order amount cannot be negative.'
        : 'Enter a valid order amount.';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.classList.remove('error');
      result.textContent = 'Calculating…';

      try {
        const response = await fetch('/api/discounts/calculate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderAmount: Number(amountInput.value) })
        });
        const body = await response.json();
        if (!response.ok) {
          result.classList.add('error');
          result.textContent = body.error ?? 'Unable to calculate discount.';
          return;
        }
        result.textContent = `Discount: ${body.discountAmount.toFixed(2)} | Payable amount: ${body.payableAmount.toFixed(2)}`;
      } catch {
        result.classList.add('error');
        result.textContent = 'Could not connect to the training application.';
      }
    });
  </script>
</body>
</html>
